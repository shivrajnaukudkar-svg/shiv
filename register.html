<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduLearn - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="auth-body">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="index.html">

            <i class="bi bi-mortarboard-fill"></i>
            EduLearn

        </a>

        <a href="index.html"
           class="btn btn-outline-light">

            <i class="bi bi-house"></i>
            Home

        </a>

    </div>

</nav>


<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="auth-icon">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h2 class="fw-bold mt-3">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join EduLearn today
                        </p>

                    </div>


                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="First name"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Last name"
                                       required>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   placeholder="Enter mobile number"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Select Course
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Choose a course
                                </option>

                                <option>
                                    Web Development
                                </option>

                                <option>
                                    Python Programming
                                </option>

                                <option>
                                    Database Management
                                </option>

                                <option>
                                    Java Programming
                                </option>

                            </select>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       placeholder="Password"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       placeholder="Confirm password"
                                       required>

                            </div>

                        </div>


                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   required>

                            <label class="form-check-label">

                                I agree to the
                                <a href="#">
                                    Terms & Conditions
                                </a>

                            </label>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100 py-2">

                            <i class="bi bi-person-plus"></i>
                            Create Account

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p class="text-muted">

                            Already have an account?

                            <a href="login.html"
                               class="fw-bold text-primary">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 EduLearn. All Rights Reserved.
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
